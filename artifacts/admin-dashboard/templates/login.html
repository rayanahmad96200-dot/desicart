<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — DesiCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }
        .brand-logo {
            font-size: 2rem;
            color: #e07b2a;
            margin-bottom: 4px;
        }
        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
        }
        .brand-sub {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .form-control {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #e07b2a;
            box-shadow: 0 0 0 3px rgba(224,123,42,0.12);
        }
        .input-group-text {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px 0 0 10px;
            color: #94a3b8;
        }
        .btn-login {
            background: #e07b2a;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #c96a1a; color: #fff; }
        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.875rem;
        }
        .divider { color: #94a3b8; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-logo"><i class="bi bi-cart3"></i></div>
        <div class="brand-name">DesiCart</div>
        <div class="brand-sub">Admin Panel</div>
    </div>

    {% if error %}
    <div class="error-box mb-3">
        <i class="bi bi-exclamation-circle me-2"></i>{{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/login">
        <div class="mb-3">
            <label class="form-label fw-500 text-secondary small">USERNAME</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-500 text-secondary small">PASSWORD</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
                <button type="button" class="btn btn-light border" onclick="togglePwd()" style="border-radius:0 10px 10px 0!important;border-left:0!important;">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-login">
            <i class="bi bi-shield-lock me-2"></i>Sign In to Admin Panel
        </button>
    </form>

    <div class="text-center mt-4 divider">
        <i class="bi bi-shield-check me-1"></i>Secure admin access only
    </div>
</div>
<script>
function togglePwd() {
    const p = document.getElementById('password');
    const i = document.getElementById('eyeIcon');
    if (p.type === 'password') { p.type = 'text'; i.className = 'bi bi-eye-slash'; }
    else { p.type = 'password'; i.className = 'bi bi-eye'; }
}
</script>
</body>
</html>
